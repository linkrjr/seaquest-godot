name: "Build Godot Deliverables"

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Export Windows Binary"
        uses: firebelley/godot-export@v5.2.0
        with:
          godot_version: 4.7.1
          export_preset: "Windows Desktop"
          project_dir: "."
          godot_export_args: "--headless"

      - name: Archive Windows Build
        run: |
          cd /home/runner/.local/share/godot/builds
          zip -r ../../../../windows-build.zip .
          cd ../../../../
          mv windows-build.zip seaquest-windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seaquest
          path: seaquest-windows.zip

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        run: |
          curl -L -o Godot.zip https://github.com
          unzip Godot.zip
          mv Godot.app /Applications/Godot.app
          rm Godot.zip

      - name: Create Build Directory
        run: mkdir -p build/mac

      - name: Export macOS App
        run: |
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "macOS" build/mac/seaquest.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seaquest
          path: /builds/mac

  publish-release:
    name: Publish Github Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: seaquest-windows
          path: ./dist

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: seaquest-mac
          path: ./dist

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/seaquest-windows.zip
            ./dist/seaquest.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
