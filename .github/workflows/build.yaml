name: "Build Godot Deliverables"

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  # Must match config/features in project.godot (currently "4.7").
  GODOT_RELEASE: "4.7.1-stable"
  # Same version in the directory-name form Godot uses for export templates.
  GODOT_TEMPLATE_VERSION: "4.7.1.stable"

jobs:
  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        run: |
          curl -fL -o Godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q Godot.zip
          mkdir -p "$HOME/.local/bin"
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          rm Godot.zip

      - name: Install Export Templates
        run: |
          curl -fL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv templates "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          rm templates.tpz

      - name: Import Project Resources
        run: |
          "$HOME/.local/bin/godot" --headless --path "$PWD" --import

      - name: Export Windows Binary
        run: |
          mkdir -p build/windows
          "$HOME/.local/bin/godot" --headless --path "$PWD" \
            --export-release "Windows Desktop" "$PWD/build/windows/seaquest.exe"

      - name: Archive Windows Build
        run: |
          mkdir -p dist
          cd build/windows
          zip -r "$GITHUB_WORKSPACE/dist/seaquest-windows.zip" .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seaquest-windows
          path: dist/seaquest-windows.zip
          if-no-files-found: error

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        run: |
          curl -fL -o Godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_macos.universal.zip"
          unzip -q Godot.zip
          mv Godot.app /Applications/Godot.app
          rm Godot.zip

      - name: Install Export Templates
        run: |
          curl -fL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates"
          mv templates "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          rm templates.tpz

      - name: Import Project Resources
        run: |
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path "$PWD" --import

      - name: Export macOS App
        run: |
          mkdir -p dist
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path "$PWD" \
            --export-release "macOS" "$PWD/dist/seaquest.dmg"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seaquest-mac
          path: dist/seaquest.dmg
          if-no-files-found: error

  publish-release:
    name: Publish Github Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: seaquest-*
          merge-multiple: true
          path: ./dist

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/seaquest-windows.zip
            ./dist/seaquest.dmg
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
